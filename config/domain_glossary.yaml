domain_glossary:
  domains:
    financial_report:
      display_name: 财务报告
      composites:
        - id: financial_three_statements
          display_name: 财务三表
          aliases:
            - 财务三表
            - 三大财务报表
            - 三张财务报表
            - 三张报表
          default_query_type: analysis
          allowed_query_types:
            - information_extraction
            - analysis
            - summarization
          strategy: subtask_independent_retrieval
          retrieval_tool: parallel_hybrid_retrieval
          reason: The question asks for multiple financial statement objects that should not compete in one retrieval pool.
          slots:
            period: 报告期
            focus: summary
          decomposition:
            mode: agent_planned
            required_objects:
              - slot: balance_sheet
                display_name: 资产负债表
                match_terms:
                  - 合并资产负债表
                  - 资产负债表
              - slot: income_statement
                display_name: 利润表
                match_terms:
                  - 合并利润表
                  - 利润表
              - slot: cash_flow_statement
                display_name: 现金流量表
                match_terms:
                  - 合并现金流量表
                  - 现金流量表
