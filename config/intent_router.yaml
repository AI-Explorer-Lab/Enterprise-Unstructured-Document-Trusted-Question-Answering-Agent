intent_router:
  enabled: true
  top_k: 3
  prototype_score_top_n: 3
  min_intent_score: 0.72
  min_score_margin: 0.08
  ambiguous_candidate_limit: 3
  unknown_strategy: clarify
  llm_fallback_enabled: true
  calibration_status: initial
  prototypes:
    information_extraction:
      - 查询公司2025年的营业收入是多少
      - 告诉我年报披露的归母净利润金额
      - 提取资产负债表中的货币资金期末余额
      - 查找利润表里的营业成本数值
      - 年报中经营活动现金流量净额是多少
      - 这家公司的法定代表人是谁
      - 查询公司的注册地址和办公地址
      - 年报披露的股票代码是什么
      - 找出公司聘请的会计师事务所名称
      - 第一大股东是谁以及持股数量是多少
      - 年报中员工总人数是多少
      - 查询公司披露的研发投入金额
      - 提取应收账款账面价值
      - 年报披露的毛利率是多少
      - 公司本年度的利润分配方案是什么
      - 查找重大诉讼涉及的金额
      - 年报中列出的关联方名称有哪些
      - 提取某项会计政策的原文内容
      - 哪一页披露了营业收入数据
      - 找到年报中关于风险因素的具体表述
    metric_calculation:
      - 根据两年营业收入计算同比增长率
      - 计算本期净利润比上期增加了多少
      - 用研发投入和营业收入计算研发投入占比
      - 根据负债总额和资产总额计算资产负债率
      - 用营业收入与营业成本计算毛利率
      - 根据流动资产和流动负债计算流动比率
      - 计算速动资产相对于流动负债的速动比率
      - 用净利润和股本计算每股收益
      - 计算营业收入过去三年的复合增长率
      - 求两个报告期货币资金的差额
      - 计算各业务板块收入占总收入的比例
      - 根据经营现金流和净利润计算现金含量
      - 用息税前利润和利息费用计算利息保障倍数
      - 计算总负债与股东权益的比值
      - 根据净利润和平均总资产计算总资产收益率
      - 根据归母净利润和平均净资产计算净资产收益率
      - 用流动资产减去流动负债计算营运资金
      - 根据经营现金流和资本开支计算自由现金流
      - 计算应收账款周转率
      - 把年报中的多个已披露数值推导成新指标
    comparison:
      - 比较两家公司2025年的营业收入
      - 对比公司2024年和2025年的净利润表现
      - 哪家公司的经营现金流更高
      - 比较两份年报披露的研发投入
      - 对照不同报告期的资产负债情况
      - 比较两个业务板块的收入规模
      - 哪个年度的毛利率更高
      - 对比两家公司主要风险因素的异同
      - 比较母公司报表与合并报表的差异
      - 对照年报和半年报中的经营数据
      - 比较同行企业的应收账款水平
      - 哪家公司的盈利能力更强
      - 对比两个年度的现金流结构
      - 比较境内业务与境外业务的收入表现
      - 对照两家公司前五大客户集中度
      - 比较不同产品类别的销售收入
      - 对比管理层对未来经营计划的表述
      - 比较两年审计意见是否发生变化
      - 将多个公司按营业收入高低进行比较
      - 说明两个报告对象有哪些相同点和不同点
    analysis:
      - 分析营业收入下降的主要原因
      - 解读净利润增长是否具有持续性
      - 分析经营现金流为负意味着什么
      - 判断应收账款上升可能带来的风险
      - 解释毛利率变化背后的经营因素
      - 分析资产负债率上升对偿债能力的影响
      - 解读资产负债表反映的财务状况
      - 分析利润表中盈利能力的变化趋势
      - 解读现金流量表反映的资金压力
      - 根据财务三表分析公司的经营表现
      - 分析研发投入变化对未来业务的影响
      - 判断存货增长是否存在减值风险
      - 解释收入增长但现金流下降的原因
      - 分析客户集中度较高可能产生的影响
      - 解读管理层讨论中的行业趋势
      - 分析公司面临的主要经营风险
      - 判断利润增长主要由主营业务还是非经常性损益驱动
      - 分析资本开支增加对自由现金流的影响
      - 根据年报证据评价公司的盈利质量
      - 说明财务指标异常变化可能反映的问题
    summarization:
      - 总结这份年度报告的主要内容
      - 概括管理层讨论与分析章节
      - 梳理年报披露的主要风险
      - 对公司本年度经营情况做摘要
      - 总结财务报表附注中的重点事项
      - 概括董事会报告的核心信息
      - 提炼年报中的关键财务数据
      - 汇总公司主要业务和产品
      - 总结公司治理章节
      - 概括年度利润分配方案
      - 梳理重大诉讼和仲裁事项
      - 汇总关联交易的主要内容
      - 总结研发活动和研发成果
      - 概括募集资金使用情况
      - 提炼审计报告的主要结论
      - 总结重要会计政策和会计估计
      - 梳理公司未来经营计划
      - 概括环境和社会责任信息
      - 将多个章节的要点汇总成简要说明
      - 用一段话概述整份年报
